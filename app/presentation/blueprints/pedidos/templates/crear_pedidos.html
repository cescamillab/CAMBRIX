{% extends "base.html" %}

{% block content %}

<div class="navbar-top mb-4">
    <h2 class="page-title"><i class="bi bi-file-earmark-plus"></i> Crear Nuevo Pedido</h2>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="stat-card">
            
            <form method="POST" class="row g-4">
                
                <!-- SECCIÓN CLIENTE -->
                <div class="col-12 mb-2">
                    <h5 class="text-cambri-blue border-bottom pb-2"><i class="bi bi-person-badge"></i> Información del Cliente</h5>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Tipo de Registro</label>
                    <select name="tipo_cliente" id="tipo_cliente" class="form-select shadow-sm" onchange="toggleCliente()">
                        <option value="existente">Cliente Existente (Base de datos)</option>
                        <option value="nuevo">Registrar Nuevo Cliente</option>
                    </select>
                </div>

                <!-- Cliente Existente -->
                <div id="cliente_existente_div" class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Seleccionar Cliente</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-search"></i></span>
                        <select name="cliente_existente" class="form-select border-start-0">
                            {% for cliente in clientes %}
                                <option value="{{ cliente.id }}">{{ cliente.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Cliente Nuevo -->
                <div id="cliente_nuevo_div" class="col-12" style="display:none;">
                    <div class="row g-3 p-3 bg-light rounded-3 border">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control shadow-sm" placeholder="Ej. Empresa S.A.">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">Teléfono</label>
                            <input type="text" name="telefono" class="form-control shadow-sm" placeholder="Ej. 3001234567">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">Correo Electrónico</label>
                            <input type="email" name="correo" class="form-control shadow-sm" placeholder="ejemplo@correo.com">
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN DETALLES DEL PEDIDO -->
                <div class="col-12 mt-5 mb-2">
                    <h5 class="text-cambri-blue border-bottom pb-2"><i class="bi bi-card-text"></i> Detalles del Pedido</h5>
                </div>

                <div class="col-md-8">
                    <label class="form-label fw-bold text-secondary small">Descripción del Trabajo</label>
                    <textarea name="descripcion" class="form-control shadow-sm" rows="4" placeholder="Describe los detalles del pedido..." required></textarea>
                </div>

                <div class="col-md-4 d-flex flex-column gap-3">
                    <div>
                        <label class="form-label fw-bold text-secondary small">Fecha de Entrega</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-calendar-event"></i></span>
                            <input type="date" name="fecha_entrega" class="form-control border-start-0" required>
                        </div>
                    </div>
                    <div>
                        <label class="form-label fw-bold text-secondary small">Asignar a Empleado</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-person-gear"></i></span>
                            <select name="responsable_id" class="form-select border-start-0" required>
                                {% for empleado in empleados %}
                                    <option value="{{ empleado.id }}">{{ empleado.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN FINANCIERA -->
                <div class="col-12 mt-4 mb-2">
                    <h5 class="text-success border-bottom pb-2"><i class="bi bi-cash-stack"></i> Finanzas</h5>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Valor Total ($)</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-success fw-bold">$</span>
                        <input type="number" step="0.01" name="valor_total" class="form-control border-start-0" placeholder="0.00" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Anticipo Pagado ($)</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-warning fw-bold">$</span>
                        <input type="number" step="0.01" name="anticipo" class="form-control border-start-0" placeholder="0.00" required>
                    </div>
                </div>

                <!-- BOTONES -->
                <div class="col-12 mt-5 pt-3 border-top d-flex justify-content-between">
                    <a href="{{ url_for('pedidos.listar_pedidos') }}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                    <button type="submit" class="btn text-white bg-cambri-blue px-5 py-2 fw-bold" style="border-radius: 10px;">
                        <i class="bi bi-check-circle"></i> Guardar Pedido
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
function toggleCliente() {
    var tipo = document.getElementById("tipo_cliente").value;
    var existente = document.getElementById("cliente_existente_div");
    var nuevo = document.getElementById("cliente_nuevo_div");

    if (tipo === "nuevo") {
        existente.style.display = "none";
        nuevo.style.display = "block";
    } else {
        existente.style.display = "block";
        nuevo.style.display = "none";
    }
}
</script>

{% endblock %}
