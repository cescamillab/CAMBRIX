{% extends "base.html" %}
{% block content %}

<div class="navbar-top mb-4">
    <h2 class="page-title"><i class="bi bi-pencil-square"></i> Editar Material: <span class="text-cambri-blue">{{ material.nombre }}</span></h2>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="stat-card shadow-lg" style="border-radius: 20px; padding: 40px;">
            <form method="POST" class="row g-4">
                
                <div class="col-md-12">
                    <label class="form-label fw-bold text-secondary small">Nombre del Material</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-tag-fill"></i></span>
                        <input type="text" name="nombre" class="form-control border-start-0 ps-0" value="{{ material.nombre }}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Categoría</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-grid-fill"></i></span>
                        <input type="text" name="categoria" class="form-control border-start-0 ps-0" value="{{ material.categoria }}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Unidad de Medida</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-rulers"></i></span>
                        <input type="text" name="unidad" class="form-control border-start-0 ps-0" value="{{ material.unidad_medida }}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Stock Mínimo (Alerta)</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-danger"><i class="bi bi-bell-fill"></i></span>
                        <input type="number" step="0.01" name="stock_minimo" class="form-control border-start-0 ps-0" value="{{ material.stock_minimo }}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Costo Unitario ($)</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-success fw-bold">$</span>
                        <input type="number" step="0.01" name="costo" class="form-control border-start-0 ps-0" value="{{ material.costo_unitario }}">
                    </div>
                </div>

                <div class="col-12 mt-5 pt-3 border-top d-flex justify-content-between">
                    <a href="{{ url_for('inventarios.listar_materiales') }}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 12px;">
                        <i class="bi bi-arrow-left"></i> Volver al Inventario
                    </a>
                    <button type="submit" class="btn text-white bg-cambri-blue px-5 py-2 fw-bold shadow-hover" style="border-radius: 12px;">
                        <i class="bi bi-check-circle-fill"></i> Actualizar Material
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
