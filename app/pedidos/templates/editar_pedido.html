{% extends "base.html" %}

{% block content %}

<div class="navbar-top mb-4">
    <h2 class="page-title"><i class="bi bi-pencil-square"></i> Editar Pedido #{{ pedido.id }}</h2>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="stat-card">
            
            <form method="POST" class="row g-4">
                
                <!-- SECCIÓN CLIENTE -->
                <div class="col-12 mb-2">
                    <h5 class="text-cambri-blue border-bottom pb-2"><i class="bi bi-person-badge"></i> Información del Cliente</h5>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-secondary small">Modificar Cliente Asignado</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-person-check"></i></span>
                        <select name="cliente_id" class="form-select border-start-0">
                            {% for cliente in clientes %}
                                <option value="{{ cliente.id }}" {% if cliente.id == pedido.cliente_id %}selected{% endif %}>
                                    {{ cliente.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- SECCIÓN DETALLES DEL PEDIDO -->
                <div class="col-12 mt-5 mb-2">
                    <h5 class="text-cambri-blue border-bottom pb-2"><i class="bi bi-card-text"></i> Detalles del Pedido</h5>
                </div>

                <div class="col-md-8">
                    <label class="form-label fw-bold text-secondary small">Descripción del Trabajo</label>
                    <textarea name="descripcion" class="form-control shadow-sm" rows="4" required>{{ pedido.descripcion }}</textarea>
                </div>

                <div class="col-md-4 d-flex flex-column gap-3">
                    <div>
                        <label class="form-label fw-bold text-secondary small">Fecha de Entrega</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-calendar-event"></i></span>
                            <input type="date" name="fecha_entrega" class="form-control border-start-0" value="{{ pedido.fecha_entrega }}" required>
                        </div>
                    </div>
                    <div>
                        <label class="form-label fw-bold text-secondary small">Asignar a Empleado</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-person-gear"></i></span>
                            <select name="responsable_id" class="form-select border-start-0" required>
                                {% for empleado in empleados %}
                                    <option value="{{ empleado.id }}" {% if empleado.id == pedido.responsable_id %}selected{% endif %}>
                                        {{ empleado.username }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN FINANCIERA -->
                <div class="col-12 mt-4 mb-2">
                    <h5 class="text-success border-bottom pb-2"><i class="bi bi-cash-stack"></i> Finanzas</h5>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Valor Total ($)</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-success fw-bold">$</span>
                        <input type="number" step="0.01" name="valor_total" class="form-control border-start-0" value="{{ pedido.valor_total }}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary small">Anticipo Pagado ($)</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-warning fw-bold">$</span>
                        <input type="number" step="0.01" name="anticipo" class="form-control border-start-0" value="{{ pedido.anticipo }}" required>
                    </div>
                </div>

                <!-- BOTONES -->
                <div class="col-12 mt-5 pt-3 border-top d-flex justify-content-between">
                    <a href="{{ url_for('pedidos.detalle_pedido', pedido_id=pedido.id) }}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn text-white bg-cambri-blue px-5 py-2 fw-bold" style="border-radius: 10px;">
                        <i class="bi bi-save"></i> Guardar Cambios
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
