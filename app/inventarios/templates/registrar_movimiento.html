{% extends "base.html" %}
{% block content %}

<div class="navbar-top mb-4">
    <h2 class="page-title"><i class="bi bi-arrow-left-right"></i> Registrar Movimiento de Stock</h2>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="stat-card shadow-lg" style="border-radius: 20px; padding: 40px;">
            
            <div class="text-center mb-4">
                <h4 class="fw-bold mb-1">{{ material.nombre }}</h4>
                <div class="badge badge-custom text-cambri-blue" style="background: rgba(2, 158, 242, 0.1); font-size: 1rem;">
                    Stock Actual: <strong>{{ material.stock_actual }} {{ material.unidad_medida }}</strong>
                </div>
            </div>

            <form method="POST" class="row g-4">
                
                <div class="col-md-12">
                    <label class="form-label fw-bold text-secondary small">Tipo de Movimiento</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-box-arrow-in-right"></i></span>
                        <select name="tipo" class="form-select border-start-0 ps-0" required>
                            <option value="entrada">📥 Entrada (Aumentar stock)</option>
                            <option value="salida">📤 Salida (Disminuir stock)</option>
                        </select>
                    </div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-secondary small">Cantidad</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-123"></i></span>
                        <input type="number" step="0.01" name="cantidad" class="form-control border-start-0 ps-0" placeholder="0.00" required>
                    </div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-secondary small">Motivo / Descripción</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-cambri-blue"><i class="bi bi-chat-left-dots-fill"></i></span>
                        <input type="text" name="motivo" class="form-control border-start-0 ps-0" placeholder="Ej. Compra a proveedor, Ajuste mensual...">
                    </div>
                </div>

                <div class="col-12 mt-5 pt-3 border-top d-flex justify-content-between">
                    <a href="{{ url_for('inventarios.listar_materiales') }}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 12px;">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn text-white bg-cambri-blue px-5 py-2 fw-bold shadow-hover" style="border-radius: 12px;">
                        <i class="bi bi-check-circle-fill"></i> Registrar Movimiento
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
