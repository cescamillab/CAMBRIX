{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="bi bi-gear-fill"></i> Reporte de Producción</h2>
        <div>
            <button class="btn btn-outline-success me-2" onclick="exportarExcel()"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button>
            <button class="btn btn-outline-danger" onclick="exportarPDF()"><i class="bi bi-file-earmark-pdf"></i> Exportar PDF</button>
        </div>
    </div>

    <!-- Filtros -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form id="filtrosForm" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Fecha Inicio (Creación Pedido)</label>
                    <input type="date" class="form-control" id="fecha_inicio">
                </div>
                <div class="col-md-5">
                    <label class="form-label">Fecha Fin (Creación Pedido)</label>
                    <input type="date" class="form-control" id="fecha_fin">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-primary w-100" onclick="cargarDatos()">Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table id="produccionTable" class="table table-striped table-hover align-middle" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            <th>Pedido ID</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin Real</th>
                            <th>Material Usado</th>
                            <th>Cant.</th>
                            <th>Costo ($)</th>
                            <th>Operario</th>
                            <th>Estado Pedido</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
let tablaProd;
$(document).ready(function() {
    tablaProd = $('#produccionTable').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
        columns: [
            { data: 'id' },
            { data: 'fecha_inicio' },
            { data: 'fecha_fin_real' },
            { data: 'producto' },
            { data: 'cantidad_usada' },
            { data: 'costo_total', render: $.fn.dataTable.render.number(',', '.', 2, '$') },
            { data: 'operario_asignado' },
            { data: 'estado' }
        ]
    });
    cargarDatos();
});

function cargarDatos() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    $.ajax({
        url: "{{ url_for('reportes.api_produccion') }}",
        data: { fecha_inicio: fi, fecha_fin: ff },
        success: function(res) {
            tablaProd.clear();
            tablaProd.rows.add(res.data);
            tablaProd.draw();
        }
    });
}

function exportarExcel() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    window.location.href = `{{ url_for('reportes.reporte_produccion_excel') }}?fecha_inicio=${fi}&fecha_fin=${ff}`;
}
function exportarPDF() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    window.location.href = `{{ url_for('reportes.reporte_produccion_pdf') }}?fecha_inicio=${fi}&fecha_fin=${ff}`;
}
</script>
{% endblock %}
