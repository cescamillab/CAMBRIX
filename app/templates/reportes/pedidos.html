{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="bi bi-cart-check"></i> Reporte de Ventas y Pedidos</h2>
        <div>
            <button class="btn btn-outline-success me-2" onclick="exportarExcel()"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button>
            <button class="btn btn-outline-danger" onclick="exportarPDF()"><i class="bi bi-file-earmark-pdf"></i> Exportar PDF</button>
        </div>
    </div>

    <!-- Filtros (Accordion) -->
    <div class="accordion mb-4" id="filtroAccordion">
        <div class="accordion-item shadow-sm border-0">
            <h2 class="accordion-header" id="headingFiltros">
                <button class="accordion-button bg-light text-dark fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFiltros" aria-expanded="true" aria-controls="collapseFiltros">
                    <i class="bi bi-funnel-fill me-2"></i> Filtros Avanzados
                </button>
            </h2>
            <div id="collapseFiltros" class="accordion-collapse collapse show" aria-labelledby="headingFiltros" data-bs-parent="#filtroAccordion">
                <div class="accordion-body">
                    <form id="filtrosForm" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha Fin</label>
                            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="">Todos</option>
                                <option value="cotizado">Cotizado</option>
                                <option value="aprobado">Aprobado</option>
                                <option value="en_produccion">En Producción</option>
                                <option value="terminado">Terminado</option>
                                <option value="entregado">Entregado</option>
                                <option value="cancelado">Cancelado</option>
                            </select>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="button" class="btn btn-primary w-100" onclick="cargarDatos()">Filtrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Tarjetas de Resumen -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Total Pedidos</h5>
                    <h2 id="kpi_total_pedidos">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Ingresos Totales</h5>
                    <h2 id="kpi_ingresos">$0.00</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de Datos -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table id="pedidosTable" class="table table-striped table-hover align-middle" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Fecha Creación</th>
                            <th>Fecha Entrega</th>
                            <th>Cliente</th>
                            <th>Vendedor</th>
                            <th>Valor Total</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Librerías Externas -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
let tablaPedidos;

$(document).ready(function() {
    tablaPedidos = $('#pedidosTable').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
        columns: [
            { data: 'id' },
            { data: 'fecha_creacion' },
            { data: 'fecha_entrega' },
            { data: 'cliente' },
            { data: 'vendedor' },
            { 
                data: 'valor_total',
                render: $.fn.dataTable.render.number(',', '.', 2, '$')
            },
            { 
                data: 'estado',
                render: function(data) {
                    let badgeClass = 'bg-secondary';
                    if(data === 'entregado') badgeClass = 'bg-success';
                    else if(data === 'en_produccion') badgeClass = 'bg-warning text-dark';
                    else if(data === 'cancelado') badgeClass = 'bg-danger';
                    return `<span class="badge ${badgeClass}">${data.toUpperCase()}</span>`;
                }
            }
        ]
    });

    cargarDatos();
});

function cargarDatos() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    let est = $('#estado').val();

    $.ajax({
        url: "{{ url_for('reportes.api_pedidos') }}",
        data: { fecha_inicio: fi, fecha_fin: ff, estado: est },
        success: function(res) {
            tablaPedidos.clear();
            tablaPedidos.rows.add(res.data);
            tablaPedidos.draw();
            
            // Actualizar KPIs
            $('#kpi_total_pedidos').text(res.data.length);
            let total = res.data.reduce((acc, curr) => acc + parseFloat(curr.valor_total || 0), 0);
            $('#kpi_ingresos').text('$' + total.toLocaleString('en-US', {minimumFractionDigits: 2}));
        }
    });
}

function exportarExcel() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    window.location.href = `{{ url_for('reportes.reporte_pedidos_excel') }}?fecha_inicio=${fi}&fecha_fin=${ff}`;
}

function exportarPDF() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    window.location.href = `{{ url_for('reportes.reporte_pedidos_pdf') }}?fecha_inicio=${fi}&fecha_fin=${ff}`;
}
</script>
{% endblock %}
