{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="bi bi-shield-lock-fill"></i> Auditoría y Trazabilidad</h2>
    </div>

    <div class="alert alert-info">
        <i class="bi bi-info-circle-fill"></i> Muestra el historial de acciones y movimientos del sistema. Actualmente integrado con Movimientos de Inventario.
    </div>

    <!-- Filtros -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form id="filtrosForm" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Fecha Inicio</label>
                    <input type="date" class="form-control" id="fecha_inicio">
                </div>
                <div class="col-md-5">
                    <label class="form-label">Fecha Fin</label>
                    <input type="date" class="form-control" id="fecha_fin">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-primary w-100" onclick="cargarDatos()">Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table id="trazabilidadTable" class="table table-striped table-hover align-middle" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Usuario</th>
                            <th>Acción</th>
                            <th>Módulo</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
let tablaTraz;
$(document).ready(function() {
    tablaTraz = $('#trazabilidadTable').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
        order: [[0, 'desc']],
        columns: [
            { data: 'fecha_hora' },
            { data: 'usuario' },
            { 
                data: 'accion',
                render: function(data) {
                    if (data === 'ingreso') return '<span class="badge bg-success">INGRESO</span>';
                    if (data === 'salida') return '<span class="badge bg-warning text-dark">SALIDA</span>';
                    return `<span class="badge bg-secondary">${data.toUpperCase()}</span>`;
                }
            },
            { data: 'modulo' },
            { data: 'detalle' }
        ]
    });
    cargarDatos();
});

function cargarDatos() {
    let fi = $('#fecha_inicio').val();
    let ff = $('#fecha_fin').val();
    $.ajax({
        url: "{{ url_for('reportes.api_trazabilidad') }}",
        data: { fecha_inicio: fi, fecha_fin: ff },
        success: function(res) {
            tablaTraz.clear();
            tablaTraz.rows.add(res.data);
            tablaTraz.draw();
        }
    });
}
</script>
{% endblock %}
